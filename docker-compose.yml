services:
  # --- バックエンド コアサービス ---
  backend:
    build: ./backend
    container_name: stock-core  # 名前を変更し役割を明確化
    ports:
      - "8000:8000"  # フロントエンドからのアクセス用
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ML ServiceのURL指定 (サービス名:内部ポート)
      - ML_SERVICE_URL=http://ml-service:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - ml-service

  # --- バックエンド 機械学習サービス ---
  ml-service:
    build: ./backend-ml
    container_name: stock-ml
    ports:
      - "8001:8000"  # ホストの8001番で直接アクセス/デバッグ可能にする
    volumes:
      - ./backend-ml:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # --- バックエンド インサイトサービス ---
  insight-service:
    build: ./backend-insight
    container_name: stock-insight
    ports:
      - "8002:8002"  # ホストの8002番で直接アクセス/デバッグ可能にする
    volumes:
      - ./backend-insight:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  # --- キャッシュ (Rate Limit回避・高速化) ---
  redis:
    image: redis:7-alpine
    container_name: stock-redis
    ports:
      - "6379:6379"  # ローカルからのデバッグアクセス用

  # --- フロントエンド ---
  frontend:
    # image: ... ではなく build を使う
    build: ./frontend
    container_name: stock-frontend
    ports:
      - "3000:3000"
    volumes:
      # ソースコードは同期する
      - ./frontend:/app
      # 【重要】ホストのnode_modulesをコンテナに上書きさせないための設定（匿名ボリューム）
      - /app/node_modules
    environment:
      # ブラウザから見たバックエンドのURL
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # --- データベース ---
  db:
    image: postgres:15-alpine
    container_name: stock-db
    ports:
      - "5432:5432"  # 開発デバッグ用。本番では削除すること。
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: